front:
  text: 太上老君年譜要略
  hash: sha256:3a84441e027fd89be50bdcbefdf6d27405a1d63264a7e278cea6e5c0e3a3444d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0167_CK-KZ_01p053a, image: JY085/CK-KZ_JY085_01p053a.png}
body:
  text: 永嘉謝守灝編集隱山李致道校正老君在天皇時降世號通玄天師一號玄中大法師徐整三五厯云𡻕起攝提元氣肇始有神人號天皇地皇時降爲師號有古先生春秋緯作九頭紀人皇時降爲師號盤古先生三五厯云天地混沌如雞子盤古生其中天地開闢盤古在其中後乃有三皇此三才之始也伏羲時降於田野號鬱華子祝融時降於恒山號廣夀子神農時降於濟陰號大成子黃帝時降於崆峒號廣成子少昊時復降崆峒號隨應子顓帝時降於衡山號赤精子帝嚳時降於江濱號綠圖子唐翰林承旨樂朋龜青羊宮碑云伏羲氏之王天下也老君以道弘濟降迹爲師仰觀圓蓋之文俯察方輿之理教之以畫八卦指之以分三才助之以造書契之文製之以代結繩之政洎乎神農氏之王天下也老君救時屈己下降爲師付之以五運分之以四時助之以正萬機明之以辨百穀變飮血茹毛之化移蕢桴土鼓之音毀宂焚巢上棟下宇洎乎軒轅氏之王天下也老君隱身於崆峒之中放心於杳冥之外帝乃親降輦輅禮展師資旣樞衣以趨隅遂屈膝而問道受丹經於王屋登蒼冥於鼎湖洎乎少昊氏之王天下也老君說莊敬之典教之以順時迎氣昭配神明羽族呈休命之以鳥官爲理分布九鳸以統百司景合璧以表靈鳳銜圖而示貺悉由至道彰此帝謨逮至顓帝之王天下也老君教之以解紛塞兌治國安民蕩滌九黎陟明八凱追呼六甲役御百靈訓之以微言之經教之以大順之道及乎高辛氏之王天下也老君敷道布化濟世爲師談黃庭之妙言隱日遁月稱錄圖之嘉號返邑移城制九州之名作六英之樂帝堯時降於姑射山號務成子帝舜時降於河陽號尹夀子夏禹時降於商山號眞行子殷湯時降於潛山號錫則子以上事迹互見於帝系譜帝王世紀洞神大有經玉厯經出塞記尹氏玄中記崔玄山地理志譙周古史考神仙傳記郡國圓經老君雖分身應化隨世立教事竟則隱故在世未有誕生之跡至殷朝第十八王陽甲庚申之𡻕自太淸仙境分光化氣乘日精駕九龍化爲五色流珠託胎於玄妙玉女天水尹氏己而孕厯八十一年當殷二十二王武丁庚辰𡻕二月十五日降誕於亳之苦縣瀨鄉曲仁里卽今太淸宮也殷以建丑爲𡻕首殷之二月十五日卽今之上元節也青羊宮碑云殷高宗御極之世周文王演易之初神光流入於瓊胎瑞彩結成於金骨不坼不疈誕彌於八十餘齡降瑞降祥過期者二萬餘晝至甲寅𡻕厯三十五年一日忽乘白鹿履庭檜而昇天矣今昇天檜太淸宮猶存歐陽文忠公詩云青牛西出關老子始著五千言白鹿去昇天爾來忽記三千年當時遺蹟至今在隱起蒼檜猶依然帝紂丁卯老君降於岐山之陽號燮邑子時周文王爲西伯召爲守藏史武王克殷遷爲柱下史隋内史薛道衡祠庭頌云爰自伏羲至於周世綿厯𡻕代易號變名在文王武王之時居藏室柱史之職市朝屢易貌不改焉成王時號經成子康王時號郭叔子仍柱下之職昭王時去官歸亳以二十五年癸丑五月壬午西過函谷關度關令尹喜明年甲寅授喜道德五千言是𡻕四月於喜宅南小山上昇天卽有五色光貫紫微井水皆溢二十七年乙卯復分光降生於蜀國李太官家至二十九年丁巳會尹喜於青羊之肆唐記云青羊肆者太上玄元天皇大帝第二降生之所穆王四年甲申復還中國東遊扶桑會大帝校集羣仙穆王内傳云穆王聞尹眞人得道上昇乃爲修樓觀置道士七人以奉祠事夷王元年乙丑老君與玄古三師降於蜀綿竹之三學山授李眞多之道厲王二十一年庚子老君降於樓觀授道士宋倫以中景之道通眞之經并靈飛六甲素奏丹符宣王四十三年丙辰老君降於渭川告王以𡻕星北遷言周將衰後二年幽王立唐厯代應現圖云周宣王時有採薪行歌者人莫能識以問老君老君曰此活國人修習無上正眞之道也幽王二年辛酉地動涇渭洛皆震老君曰周將衰矣不及十年之數後果爲犬戎所滅平王二十三年癸卯十二月老君復出關開化諸國遂至西流麟等洲考校羣仙事訖復還中國出西昇記敬王十七年戊戌孔子謂南宮敬叔曰吾聞老聃博古而該今通禮樂之源明道德之歸則吾師也與敬叔皆至問禮威烈王二年丁未老君過秦秦獻公授館致禮問以厯數顯王八年庚申老君東遊赤城蒙山過扶桑校集羣仙已而隱於景山之太室少室赧王九年乙卯秦昭王立老君與尹喜諸仙西遊女几雞頭天柱復出散關遂昇崑崙還紫微上宮昭王聞之乃於老君所經由處爲置城邑以表聖迹故立老停驛尹喜城見天師傳及蜀國經老君應感無方變化莫測或昇或降莫能究悉今考傳記并長厯推計自殷武丁庚辰至周赧王乙卯凡出入隱顯綿厯九百九十六年在殷一百七十四年在周八百二十二年正與史傳及諸經典相合魏明帝贊云爲周柱史經九百年大學博士呉楊昊亦云老君變通靈應難測旣生商日又仕周時計其始終乃厯千𡻕此皆舉其成數也史記稱或云百六十𡻕或云二百𡻕者是據孔子時人斟酌老君之𡻕數云爾不能知其實是以每事言蓋言或也劉向贊之曰德合元氣夀同兩儀據諸傳記說雖不同莫不贊其長夀蓋儒者以長生升天之說爲誕故但云莫知所終秦始皇二十八年壬午封禪泰山乃建老君祠於樓觀之南躬行饗禮前漢文帝初老君先降於陜河之濱人號爲河上公亦曰河上丈人帝親訪之老君授以道德二經今陝府北有河上公廟望仙臺存焉見史記成帝河平二年甲午老君降於瑯琊郡曲陽淵授于吉太平經出漢書安帝永初三年已酉老君降於泰山召江夏吏劉圖校定天下簿籍因示圖罪福報應之事見唐紀聖賦及應現圖順帝漢安元年壬午老君降於蜀之鶴鳴山授天師張道陵正一盟威祕籙五月再降賜太淸中經建康元年甲申老君再降於閬州雲臺山授天師以三洞眾經及超度九祖齋直之法見天師傳及蜀圖經桓帝永夀元年乙未老君降於成都授天師北斗削死注生之法今成都府玉局化是其地也又降於鹿堂山授以制六天斬邪之文見天師傳及蜀圖經延熹八年乙巳帝遣中常侍左悺詣苦縣祀老君命邊韶撰碑文九年帝親祀老君於濯龍宮用郊天樂見後漢紀靈帝光和二年己未老君降於天台山授仙人葛玄上淸靈寶大洞等經及三籙七品齋法見天台山記及太極仙公傳魏文帝黃初四年癸卯帝親詣苦縣老子廟致祭令有司重修廟宇見崔玄山瀨鄉記陳留王咸熙元年甲申老君降於隴右臨洮郡謂王始曰天下不久當太平見晉書晉安帝元興元年壬寅老君下降按行山嶽至華山勑仙人成公興令移居嵩山仍賜以仙藥見後魏書後魏明元神瑞二年乙卯老君降于嵩山授道士寇謙之雲中音誦新科之戒大武太延元年乙酉老君降于嵩山命寇謙之授帝以太平眞君之號遂改元太平眞君並出魏書及道釋誌武帝太昌元年壬子遣散騎常侍饒傑侍御史邯鄲亮重修亳州老君廟見瀬鄕記隋文帝明皇六年丙午詔亳州刺史楊元胄重修老君廟宇勑内侍舍人薛道衡撰碑及祠庭頌見隋書煬帝大業十三年丁丑老君降終南山語山人李湻風以唐公受命之符出金鎖流珠唐高祖武德二年己卯老君降於羊角山語吉善行令奏聞云唐得聖治社稷久長出唐書五年壬午老君再降於廟所告以破賊之期出唐書太宗眞觀元年丁亥七月丙午勑修亳州老君廟給戸二十以供灑掃出通志高宗龍朔二年壬戌帝幸洛陽宮建淸廟於北邙山以祠老君設醮慶贊老君降於殿上二眞人夾侍光曜階壇眾咸瞻仰宮闈令權大力等列狀奏聞詔依所見圖寫爲瑞像見洛州錄事楊濩師奏狀乾封元年丙寅帝封岱嶽駕至亳謁老君御製册文上尊號曰太上玄元皇帝聖母爲先天太后出唐書儀鳳二年戊寅勑建醮於洛陽淸廟老君降於壇上祥光照暎乘白馬履壇石皆有迹眾所瞻仰卽以奏聞賀表有云金相玉毫彩奪夜明之景白駒丹鬣迹流天駟之庭見朝散大夫孫瑞奏表玄宗開元三年乙卯東封岱嶽回謁亳州老君廟親書道德二經俾刻諸石以老君降誕日爲玄元節御製讚文書於寶帳額上見實錄開元二十九年辛巳閏四月帝夢老君告云吾有像在京城西南上遣使求之果得老君玉像迎至興慶宮命畫眞容分置諸州開元觀出通鑑天寶元年壬午老君降於丹鳳門外語田同秀曰我昔將入流沙藏一金匱靈符在尹喜舊宅可奏帝取之帝遣使求得之於函谷關故墟出唐書天寶二年癸未正月上老君尊號曰太聖祖玄元皇帝九月制改譙郡紫極宮爲太淸宮此太淸宮得名之始也見唐書十二月帝幸華淸宮老君降於朝元閣上遂改朝元閣爲降聖閣見書史天寶七載戊子上老君尊號曰聖祖大道玄元皇帝九載庚寅老君降於太白山語山人王玄翼以寶仙洞有妙寶眞符上命刑部尚書王倕等往求果得之十三載甲午二月癸酉帝朝獻太淸宮加上老君尊號曰太聖祖高上大道金闕玄元天皇大帝十五載丙申老君見於漢中郡黑水之側帝命刻石像於所見之處老君又乘白鹿降於利州益昌嶺上示收祿山之兆詔於所見之處立自然觀並出唐書肅宗至德二載丁酉老君降於通化郡雲龍巖自地接天儀像炳然詔圖其本明皇御製贊曰晝見殊相浮空瑞色道釋人天作禮瞻奉申命藻繪示諸郡國見唐太上高皇瑞像贊序敬宗寶厯二年丙辰老君降於太淸宮前御路見柳公權書韋處厚所撰碑懿宗咸通十年己丑九月徐州賊龐勳來寇亳領其徒三千餘人趍太淸宮欲據爲營壘時士庶數百餘家在宮避難咸見老君乘空而行須臾黑霧昏曀賊迷路自相蹂踐勳亦溺水而死見汴州節度李蔚奏狀僖宗廣明二年庚子七月黃巢攻刦郡邑將焚亳州太淸宮忽陰風四起變暑爲寒賊眾駭散卒不能攻而去見唐書宋太祖建隆元年庚申遣使詣亳州太淸宮致祭太宗湻化四年癸巳遣內侍李守倫等下兩浙選擇良材重修亳州太淸宮詔水部員外郎和濛撰碑眞宗咸平五年壬寅遣內侍陳延慶增修亳州太淸宮仍給衞士大中祥符五年壬子遣三司使丁謂代謁七年甲寅駕幸亳州謁太淸宮親奉寶册上尊號曰太上老君混元上德皇帝已上並出宋朝事實哲宗紹聖五年戊寅亳州刺史喻陟奏太淸宮屢降瑞應遂遣內侍蘇珪就宮建普天大醮三千六百分仍詔本路轉運司凡宮宇弊壞者隨卽繕完徽宗崇甯元年壬午詔翰林學士張商英撰亳州太淸宮碑記徽宗御篆額賁於碑首出宋實錄政和二年壬辰老君乘白馬駕祥雲降於茅山玉晨觀授梁先生加句天童護命經見句曲志其餘降見事迹記傳不繫時代者不述與夫放光現瑞靈應等事非化身下降者亦不復載於譜也
