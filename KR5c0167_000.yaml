body:
  text: 太上老君年請要略太上老君金書內序太上光君年譜要略永嘉謝守灝編集隱山李致道校正老君在天皇時降世號通玄天師一號玄中大法師徐整三五曆云歲起攝提元氣肇始有神人號天皇地皇時降為師號有古先生春秋緯作九頭紀人皇時降為師號盤古先生三五曆云天地混沌如雞子盤古生其中天地開闢盤古在其中後乃有三皇此三才之始也伏羲時降于田野號鬱華子祝融時降于恆山號廣壽子神農時降于濟隂號大成子黃帝時降于崆洞號廣成子少昊時復降崆洞號隨應子顓帝時降于衡山號赤精子帝嚳時降于江濱號緑圖子唐翰林承旨樂朋龜青羊宫碑云伏羲氏之王天下也老君以道弘濟降迹為師仰觀圓蓋之文俯察方輿之理教之以畫八卦指之以分三才助之以造書契之文製之以代結繩之政洎乎神農氐之王天下也老君救時屈巳下降為師付之以五運分之以四時助之以正萬機明之以辨百榖變飮血茹毛之化移蕢桴土鼓之音毁冗焚巢上棟下宇洎乎軒轅氐之王天下也老君隱身於崆洞之中放心於杳冥之外帝乃親降輦輅禮展師資既摳衣以趨隅遂屈膝而問道受丹經於王屋登蒼冥於鼎湖洎乎少昊氏之王天下也老君説莊敬之典教之以順時迎氣昭配神明羽族呈休命之以烏官為理分布九鳸以統百司景合璧以表靈鳳䘖圖而示貺悉由至道彰此帝謨逮至顓帝之王天下也老君教之以解紛塞兊治國安民蕩滌九黎陟明八凱追呼六甲役御百靈訓之以微言之經教之以大順之道及乎髙辛氏之王天下也老君敷道布化濟世為師談黃庭之妙言隱日遁月稱録圖之嘉號返邑移城制九州之名作六英之樂帝堯時降于姑射山號務成子帝舜時降于河陽號尹壽子夏禹時降于商山號真行子殷湯時降于潛山號錫則子以上事迹互見於帝系譜帝王世紀洞神大有經玊曆經出塞記尹氏玄中記崔玄山地理志譙周古史考神仙傳記郡國圓經老君雖分身應化隨世立教事竟則隱故在世未有誕生之迹至殷朝第十八王陽甲庚申之歲自太清仙境分光化氣乘日精駕九龍化為五色流珠託胎於玄妙玊女天水尹氏巳而孕歷八十一年當殷二十二王武丁庚辰歲二月十五日降誕於亳之苦縣瀨鄉曲仁里即今太清宫也殷以建丑為歲首殷之二月十五日即今之上元節也青羊宫碑云殷髙宗御極之世周文王演易之初神光流入於瓊胎瑞彩結成於金骨不坼不疈誕彌於八十餘齡降瑞降祥過期者二萬餘畫至甲寅歲歷三十五年一日忽乘白鹿履庭檜而升天矣今升天檜太清宫猶存歐陽文忠公詩云青牛西出關老子始著五千言白鹿去升天爾來忽記三千年當時遺迹至今在隱起蒼檜猶依然帝紂丁卯老君降于岐山之陽號燮邑子時周文王為西伯召為守藏史武王克殷遷為柱下史隋內史薛道衡祠庭頌云爰自伏羲至於周世綿歷歲代易號變名在文王武王之時居藏室柱史之職市朝屢易貌不改焉成王時號經成子康王時號郭叔子仍柱下之職昭王時去官歸亳以二十五年癸丑五月壬午西過函谷關度關令尹喜明年甲寅授喜道德五千言是歲四月於喜宅南小山上升天即有五色光貫紫微井水皆溢二十七年乙卯復分光降生於蜀國李太官家至二十九年丁巳會尹喜於青羊之肆唐記云青羊肆者太上玄元天皇大帝第二降生之所穆王四年甲申復還中國東遊扶桑會大帝校集羣仙穆王內傳云穆王聞君真人得道上升乃為修樓觀置道士七人以奉祠事夷王元年乙丑老君與玄古三師降于蜀綿竹之三學山授李真多之道厲王二十一年庚子老君降于樓觀授道士宋倫以中景之道通真之經并靈飛六甲素奏丹符宣王四十三年丙辰老君降于渭川告王以歲星北遷言周將衰後二年幽王立唐歷代應現圖云周宣王時有採薪行歌者人莫能識以問老君老君曰此活國人修習無上正真之道也幽王二年辛酉地動涇渭洛皆震老君曰周將衰矣不及十年之數後果為犬戎所滅平王二十三年癸卯十二月老君復出關開化諸國遂至西流麟等洲考校羣仙事訖復還中國出西升記敬王十七年戊戌孔子謂南宫敬叔曰吾聞老聃博古而該今通禮樂之原明道德之歸則吾師也與敬叔皆至問禮威烈王二年丁未老君過秦秦獻公授館致禮問以曆數顯王八年庚申老君東遊赤城蒙山過扶桑校集羣仙已而隱于景山之太室少室報王九年乙卯泰昭王立老君與尹喜諸仙西遊女几雞頭天柱復出散關遂升崑崙還紫微上官昭王聞之乃於老君所經由處為置城邑以表聖迹故立老停驛尹喜城見天師傳及蜀圖經老君應感無方變化莫測或升或降莫能究悉今考傳記并長曆推計自殷武丁庚辰至周赧王乙卯凡出入隱顯綿歷九百九十六年在殷一百七十四年在周八百二十二年正與史傳及諸經典相合魏明帝贊云為周柱史經九百年大學博士吳楊昊亦云老君變通靈應難測既生商日又仕周時計其始終乃歷千歲此皆舉其成數也史記稱或云百六十歲或云二百歲者是據孔子時人斟酌老君之歲數云爾不能知其寶是以每事言蓋言或也劉向贊之曰德合元氣壽同兩儀據諸傳記説雖不同莫不贊其長夀蓋儒者以長生升天之説為誕故但云莫知所終秦始皇二十八年壬午封禪泰山乃建老君祠干樓觀之南躬行饗禮前漢文帝初老君先降于陜河之濱人號為河上公亦曰河上丈人帝親訪之老君授以道德二經今陝府北有河上公廟望仙臺存焉見史記成帝河平二年甲午老君降于琅琊郡曲陽淵授于吉大平經出漢書安帝永初三年已酉老君降于泰山召江夏吏劉圖校定天下簿籍因示圓罪福報應之事見唐紀聖賦及應現圖順帝漢安元年壬午老君降于蜀之鶴鳴山授天師張道陵正一盟威祕籙五月再降賜太清中經建康元年甲申老君再降于閬州雲臺山授天師以三洞衆經及超度九祖齋直之之法見天師傳及蜀圖經桓帝永壽元年乙未老君降于成都授天師北斗削死注生之法今成都府玉局化是其地也又降于鹿堂山授以制六天斬邪之文見天師傳及蜀圖經延熹八年乙已帝遣中常侍左悺韻苦縣祀老君命邊韶撰碑文九年帝親祀老君於濯龍宫用郊天樂見後漢紀靈帝光和二年己未老君降于天台山授仙人葛玄上清靈寶大洞等經及三籙七品齋法見天台山記及太極仙公傳魏文帝黃初四年癸卯帝親詣若縣老子廟致祭令有司重修廟宇見崔玄山瀨鄉記陳留王咸熙元年甲申老君降于隴右臨洮郡謂王始曰天下不久當太平見醫書骨安帝元興元年壬寅老君下降按行山嶽至華山勑仙人成公興令移居嵩山仍賜以仙藥見後魏書後魏明元神瑞二年乙卯老君降于嵩山授道士冦謙之雲中音誦新科之戒太武太延元年乙酉老君降于嵩山命寇謙之授帝以太平真君之號遂改元太平真君並出魏書及道釋志武帝太昌元年壬子遣散騎常侍饒傑侍御史邯鄲亮重修毫州老君廟見瀨鄉記隋文帝眀皇六年丙午詔亳州剌史楊元胄重修老君廟宇勑內侍舍人薛道衡撰碑及祠庭頌見隋書煬帝大業十三年丁丑老君降終南山語山人車淳風以唐公受命之符出金鎖流珠唐髙祖武德二年已卯老君降于羊角山語吉善行令奏聞云唐得聖治社稷久長出唐書五年壬午老君再降于廟所告以破賊之期出唐書太宗貞觀元年丁亥七月丙午勑修毫州老君廟給户二十以供灑掃出通志髙宗龍朔二年壬戌帝幸洛陽宫建清廟于北邙山以祠老君設醮慶贊老君降于殿上二真人夾侍光曜階壇衆咸瞻仰宫闈令權大力等列狀奏聞詔依所見圖寫為瑞像見洛州録事查濩師奏狀乾封元年丙寅帝封岱嶽駕至毫謁老君御製册文上尊號曰太上玄元皇帝聖母為先天大后出唐書儀鳯二年戊寅敕建醮於洛陽清廟老君降于壇上祥光照映乘白馬履壇石皆有迹衆所瞻仰即以奏聞賀表有云金相玉毫彩奪夜明之景白駒丹鬛迹流天駟之庭見朝散大夫孫瑞奏表玄宗開元三年乙卯東封岱嶽回謁毫州老君廟親書道德二經俾刻諸石以老君降誕日為玄元節御製讃文書于寶帳額上見寶録開元二十九年辛巳閏四月帝夢老君告云吾有像在京城西南上遣使求之果得老君玊像迎至興慶官命畫真容分置諸州開元觀出通鑑天寶元年壬午老君降于丹鳳門外語田同秀曰我昔將入流沙藏一金匱靈符在尹喜舊宅可奏帝取之帝遣使求得之於函谷關故墟出唐書天寶二年癸未正月上老君尊號曰太聖祖玄元皇帝九月制改譙郡紫極宫為太清宫此太清宫得名之始也見唐書十二月帝幸華清官老君降于朝元閣上遂改朝元閣為降聖閣見唐史天寶七載戊子上老君尊號曰聖祖大道玄元皇帝九載庚寅老君降于太白山語山人王玄翼以寶仙洞有妙寶真符上命刑部尚書王倕等往求果得之十三載甲午二月癸酉帝朝獻太清官加上老君尊號曰太聖祖髙上大道金闕玄元天皇大帝十五載丙申老君見于漢中郡黑水之側帝命刻石像於所見之處老君又乘白鹿降于利州益昌嶺上示收祿山之兆詔於所見之處立白然觀並出唐書肅宗至德二載丁酉老君降于通化郡雲龍巗自地接天儀像炳然詔圖其本眀皇御製贊曰晝見殊相浮空瑞色道釋人天作禮瞻奉申命藻繪示諸郡國見唐太上髙皇瑞像贊序敬宗寶曆二年丙辰老君降于太清宫前御路見柳公權書韋處厚所撰碑懿宗咸通十年己丑九月徐州賊龐勳來冦亳領其徒三千餘人趍太清宫欲據為營壘時士庶數百餘家在宫避難咸見老君乘空而行須臾黑霧昏曀賊迷路自相蹂踐勳亦溺水而死見汴州節度李蔚奏狀僖宗廣明二年庚子七月黃巢攻劫郡邑將焚亳州太清宫忽陰風四起變暑為寒賊衆駭散卒不能攻而去見唐書宋太祖建隆元年庚申遣使諸亳州太清宮致祭木宗淳化四年癸巳遣內侍李守倫等下兩浙選擇良材重修亳州太清宫詔水部員外郎和濛撰碑真宗咸平五年壬寅遣內侍陳延慶增修毫州太清宫仍給衛士大中祥符五年壬子遣三司使丁謂代謁七年甲寅駕幸亳州謁太清宫親奉寶册上尊號曰太上老君混元上德皇帝巳上並出宋朝事實哲宗紹聖五年戊寅亳州剌史喻陟奏太清宫屢降瑞應遂遣內侍蘇圭就宫建普天大醮三千六百分仍詔本路轉運司凡宫宇弊壞者隨即繕完徽宗崇寧元年壬午詔翰林學士張商英撰亳州太清宫碑記徽宗御篆額賁于碑首出宋寶録政和二年壬辰老君乘白馬駕祥雲降于茅山玉晨觀授梁先生加句天童護命經見句曲志其餘降見事迹記傳不繫時代者不述與夫放光現瑞靈應等事非化身下降者亦不復載于譜也太上老君年譜要略終
